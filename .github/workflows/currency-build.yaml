name: Currency Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build'
        required: true
      version:
        description: 'Version of the package'
        required: true
      validate_build_script:
        description: 'Run build validation script'
        required: true
        default: 'false'
      wheel_build:
        description: 'Create wheel for different Python versions'
        required: true
        default: 'false'
      build_docker:
        description: 'Build docker image'
        required: true
        default: 'false'
      enable_trivy:
        description: 'Enable Trivy scan'
        required: true
        default: 'true'
      enable_syft:
        description: 'Enable Syft scan'
        required: true
        default: 'true'
      enable_grype:
        description: 'Enable Grype scan'
        required: true
        default: 'true'
      unique_id:
        description: 'Unique ID for the build'
        required: false
        default: 'None'
      large-runner-label:
        description: "New runner to use for failing build"
        required: false
        type: choice
        options:
          - ''
          - self-hosted

run-name: >
  ${{ inputs.large-runner-label != '' &&
      format('Retriggered Currency Build for package {0} and Unique ID {1} on {2}', inputs.package_name, inputs.unique_id, inputs.large-runner-label) ||
      format('Currency Build {0} && Unique ID {1}', inputs.package_name, inputs.unique_id)
  }}

jobs:

  # ---------------------------------------------------------------------------
  # build_info: reads build_info.json, runs read_buildinfo.sh, emits
  # per-UBI-major outputs (script_ubi8, script_ubi9, script_ubi10).
  # ---------------------------------------------------------------------------
  build_info:
    runs-on: self-hosted
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION: ${{ inputs.version }}
      VALIDATE_BUILD_SCRIPT: ${{ inputs.validate_build_script }}
      WHEEL_BUILD: ${{ inputs.wheel_build }}
      build_docker: ${{ inputs.build_docker }}
      ENABLE_TRIVY: ${{ inputs.enable_trivy }}
      ENABLE_SYFT: ${{ inputs.enable_syft }}
      ENABLE_GRYPE: ${{ inputs.enable_grype }}
    outputs:
      script_ubi8:           ${{ steps.emit.outputs.script_ubi8 }}
      script_ubi9:           ${{ steps.emit.outputs.script_ubi9 }}
      script_ubi10:          ${{ steps.emit.outputs.script_ubi10 }}
      skip_python_versions:  ${{ steps.emit.outputs.skip_python_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt update -y
          sudo apt install -y jq file

      - name: Install Python dependencies
        run: |
          pip3 install --force-reinstall -v "requests==2.31.0"
          pip3 install --upgrade docker

      - name: Get Build Info and Save Variables
        run: |
          chmod +x ./gha-script/read_buildinfo.sh
          bash ./gha-script/read_buildinfo.sh

      - name: Show contents of variable.sh
        run: |
          echo "===== variable.sh ====="
          cat variable.sh
          echo "======================="

      - name: Emit per-UBI outputs
        id: emit
        run: |
          source variable.sh
          echo "SCRIPT_UBI8=$SCRIPT_UBI8"
          echo "SCRIPT_UBI9=$SCRIPT_UBI9"
          echo "SCRIPT_UBI10=$SCRIPT_UBI10"
          echo "SKIP_PYTHON_VERSIONS=$SKIP_PYTHON_VERSIONS"
          {
            echo "script_ubi8<<__EOF__"
            echo "$SCRIPT_UBI8"
            echo "__EOF__"
            echo "script_ubi9<<__EOF__"
            echo "$SCRIPT_UBI9"
            echo "__EOF__"
            echo "script_ubi10<<__EOF__"
            echo "$SCRIPT_UBI10"
            echo "__EOF__"
            echo "skip_python_versions<<__EOF__"
            echo "$SKIP_PYTHON_VERSIONS"
            echo "__EOF__"
          } >> $GITHUB_OUTPUT

      - name: Create scanner-env.sh
        run: |
          mkdir package-cache
          echo "export VALIDATE_BUILD_SCRIPT='${{ inputs.validate_build_script }}'" > scanner-env.sh
          echo "export BUILD_DOCKER='${{ inputs.build_docker }}'"                  >> scanner-env.sh
          echo "export PACKAGE_NAME='${{ inputs.package_name }}'"                  >> scanner-env.sh
          echo "===== scanner-env.sh ====="
          cat scanner-env.sh
          echo "=========================="
          sudo mv variable.sh package-cache/
          sudo mv scanner-env.sh package-cache/

      - name: Archive package cache
        run: tar -czf package-cache.tar.gz package-cache/

      - name: Upload package-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-cache
          path: package-cache.tar.gz

  # ---------------------------------------------------------------------------
  # install_scan_tools: installs grype + fetches scancode-toolkit source ONCE.
  # ---------------------------------------------------------------------------
  install_scan_tools:
    needs: build_info
    if: ${{ inputs.wheel_build == 'true' || inputs.enable_grype == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y wget curl tar jq git

      - name: Fetch scancode-toolkit source
        run: |
          chmod +x ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh
          bash ./gha-script/scanner-scripts/fetch_scancode_toolkit.sh

      - name: Upload scancode-toolkit-src artifact
        uses: actions/upload-artifact@v4
        with:
          name: scancode-toolkit-src
          path: scancode-toolkit-src.tar.gz

      - name: Install grype
        run: |
          GRYPE_VERSION=$(curl -s --retry 3 https://api.github.com/repos/anchore/grype/releases/latest | jq -r '.tag_name')
          echo "Installing grype $GRYPE_VERSION for ppc64le..."
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          wget --tries=3 https://github.com/anchore/grype/releases/download/$GRYPE_VERSION/grype_${GRYPE_VERSION#v}_checksums.txt
          echo "[INFO] Verifying checksum..."
          if grep "grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz" "grype_${GRYPE_VERSION#v}_checksums.txt" | sha256sum --check --status; then
            echo "[INFO] Checksum verification successful."
            tar -xzf grype_${GRYPE_VERSION#v}_linux_ppc64le.tar.gz
          else
            echo "[ERROR] Checksum verification FAILED."
            exit 1
          fi
          mkdir -p scan-tools-bin
          mv grype scan-tools-bin/grype
          chmod +x scan-tools-bin/grype
          scan-tools-bin/grype version

      - name: Archive grype binary
        run: tar -czf scan-tools-cache.tar.gz scan-tools-bin/

      - name: Upload scan-tools-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-tools-cache
          path: scan-tools-cache.tar.gz

  # ---------------------------------------------------------------------------
  # BUILD JOBS — one per UBI major version.
  # ---------------------------------------------------------------------------

  build_ubi8:
    needs: build_info
    if: ${{ inputs.validate_build_script == 'true' && needs.build_info.outputs.script_ubi8 != '' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi8).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}
    steps:
      - uses: actions/checkout@v6
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Build Package (UBI8)
        run: |
          sudo chown -R $USER:$USER .
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi8).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}"
          echo "===== variable.sh ====="; cat package-cache/variable.sh
          echo "BUILD_SCRIPT=$BUILD_SCRIPT  TESTED_ON=$TESTED_ON"
          lscpu
          chmod +x ./gha-script/build_package.sh
          bash ./gha-script/build_package.sh
          cloned_package=$(ls -td -- */ | head -n 1)
          sudo mv "$cloned_package" package-cache/
          sudo chown -R $USER:$USER .
          cd package-cache
          echo "export CLONED_PACKAGE=\"$cloned_package\"" >> scanner-env.sh
          chmod +x ../gha-script/pre_process.sh
          bash ../gha-script/pre_process.sh
          cd $GITHUB_WORKSPACE
          gzip build_log && mv build_log.gz build_log_UBI8.gz
          echo "[INFO] Upload skipped (no credentials configured)"
      - name: Fix permissions
        run: sudo chown -R $USER:$USER package-cache && sudo chmod -R u+rwX,go+rX,go-w package-cache
      - name: Archive updated package-cache
        run: tar -czf package-cache.tar.gz package-cache/
      - name: Upload updated package-cache (UBI8)
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-cache-ubi8
          path: package-cache.tar.gz

  build_ubi9:
    needs: build_info
    if: ${{ inputs.validate_build_script == 'true' && needs.build_info.outputs.script_ubi9 != '' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi9).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi9).tested_on }}
    steps:
      - uses: actions/checkout@v6
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Build Package (UBI9)
        run: |
          sudo chown -R $USER:$USER .
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi9).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi9).tested_on }}"
          echo "===== variable.sh ====="; cat package-cache/variable.sh
          echo "BUILD_SCRIPT=$BUILD_SCRIPT  TESTED_ON=$TESTED_ON"
          lscpu
          chmod +x ./gha-script/build_package.sh
          bash ./gha-script/build_package.sh
          cloned_package=$(ls -td -- */ | head -n 1)
          sudo mv "$cloned_package" package-cache/
          sudo chown -R $USER:$USER .
          cd package-cache
          echo "export CLONED_PACKAGE=\"$cloned_package\"" >> scanner-env.sh
          chmod +x ../gha-script/pre_process.sh
          bash ../gha-script/pre_process.sh
          cd $GITHUB_WORKSPACE
          gzip build_log && mv build_log.gz build_log_UBI9.gz
          echo "[INFO] Upload skipped (no credentials configured)"
      - name: Fix permissions
        run: sudo chown -R $USER:$USER package-cache && sudo chmod -R u+rwX,go+rX,go-w package-cache
      - name: Archive updated package-cache
        run: tar -czf package-cache.tar.gz package-cache/
      - name: Upload updated package-cache (UBI9)
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-cache-ubi9
          path: package-cache.tar.gz

  build_ubi10:
    needs: build_info
    if: ${{ inputs.validate_build_script == 'true' && needs.build_info.outputs.script_ubi10 != '' }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi10).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi10).tested_on }}
    steps:
      - uses: actions/checkout@v6
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Build Package (UBI10)
        run: |
          sudo chown -R $USER:$USER .
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi10).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi10).tested_on }}"
          echo "===== variable.sh ====="; cat package-cache/variable.sh
          echo "BUILD_SCRIPT=$BUILD_SCRIPT  TESTED_ON=$TESTED_ON"
          lscpu
          chmod +x ./gha-script/build_package.sh
          bash ./gha-script/build_package.sh
          cloned_package=$(ls -td -- */ | head -n 1)
          sudo mv "$cloned_package" package-cache/
          sudo chown -R $USER:$USER .
          cd package-cache
          echo "export CLONED_PACKAGE=\"$cloned_package\"" >> scanner-env.sh
          chmod +x ../gha-script/pre_process.sh
          bash ../gha-script/pre_process.sh
          cd $GITHUB_WORKSPACE
          gzip build_log && mv build_log.gz build_log_UBI10.gz
          echo "[INFO] Upload skipped (no credentials configured)"
      - name: Fix permissions
        run: sudo chown -R $USER:$USER package-cache && sudo chmod -R u+rwX,go+rX,go-w package-cache
      - name: Archive updated package-cache
        run: tar -czf package-cache.tar.gz package-cache/
      - name: Upload updated package-cache (UBI10)
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-cache-ubi10
          path: package-cache.tar.gz

  # ---------------------------------------------------------------------------
  # WHEEL BUILD JOBS — one job per UBI version per Python version.
  # ---------------------------------------------------------------------------

  wheel_build_ubi8_py311:
    needs: [build_info, install_scan_tools]
    if: >-
      ${{ inputs.wheel_build == 'true' &&
          needs.build_info.outputs.script_ubi8 != '' &&
          !contains(needs.build_info.outputs.skip_python_versions, '3.11') }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      PYTHON_VERSION: "3.11"
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi8).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION:      ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt update -y
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        uses: actions/download-artifact@v4
        with:
          name: scan-tools-cache
      - name: Extract scan tools
        run: tar -xzf scan-tools-cache.tar.gz && echo "$GITHUB_WORKSPACE/scan-tools-bin" >> $GITHUB_PATH
      - name: Cache pip (scancode)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: scancode-pip-ppc64le-v32.4.0
      - name: Download scancode-toolkit-src
        uses: actions/download-artifact@v4
        with:
          name: scancode-toolkit-src
      - name: Extract scancode-toolkit source
        run: tar -xzf scancode-toolkit-src.tar.gz
      - name: Run build_wheels.sh
        run: |
          source package-cache/variable.sh
          source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi8).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}"
          chmod +x ./gha-script/build_wheels.sh
          bash ./gha-script/build_wheels.sh
          WHEEL_FILE=$(ls *.whl 2>/dev/null | head -n 1)
          LOG_NAME="${WHEEL_FILE:+${WHEEL_FILE%.whl}_py311_log}.gz"
          [ -z "$WHEEL_FILE" ] && LOG_NAME="wheel_build_log_ubi8_py311.gz"
          gzip wheel_build_log && mv wheel_build_log.gz "$LOG_NAME"
          echo "[INFO] Log upload skipped (no credentials configured)"
      - name: Run scancode scan on wheel
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/scancode_wheel_scan.sh
          bash ./gha-script/scanner-scripts/scancode_wheel_scan.sh
      - name: Run grype scan on wheel
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype"
          chmod +x ./gha-script/scanner-scripts/grype_wheel_scan.sh
          bash ./gha-script/scanner-scripts/grype_wheel_scan.sh
      - name: Upload wheel scan results
        run: |
          source package-cache/variable.sh
          mkdir -p wheel_scancode_py311
          find . -maxdepth 1 -name "*_output.json" ! -name "*_grype_output.json" -exec cp {} wheel_scancode_py311/ \;
          tar czf wheel_scancode_py311.tar.gz wheel_scancode_py311
          mkdir -p grype_wheel_py311
          find . -maxdepth 1 -name "*_grype_output.json" -exec cp {} grype_wheel_py311/ \;
          tar czf grype_wheel_py311.tar.gz grype_wheel_py311
          echo "[INFO] Scan result upload skipped (no credentials configured)"
      - name: Upload wheel to COS
        run: |
          if ls *.whl 1>/dev/null 2>&1; then
            echo "[INFO] Wheel upload skipped (no credentials configured): $(ls *.whl)"
          else
            echo "No wheel file found!"; exit 1
          fi
      - name: Upload CVE report
        run: echo "[INFO] CVE report upload skipped (no credentials configured)"

  wheel_build_ubi8_py312:
    needs: [build_info, install_scan_tools]
    if: >-
      ${{ inputs.wheel_build == 'true' &&
          needs.build_info.outputs.script_ubi8 != '' &&
          !contains(needs.build_info.outputs.skip_python_versions, '3.12') }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      PYTHON_VERSION: "3.12"
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi8).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION:      ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt update -y
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        uses: actions/download-artifact@v4
        with:
          name: scan-tools-cache
      - name: Extract scan tools
        run: tar -xzf scan-tools-cache.tar.gz && echo "$GITHUB_WORKSPACE/scan-tools-bin" >> $GITHUB_PATH
      - name: Cache pip (scancode)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: scancode-pip-ppc64le-v32.4.0
      - name: Download scancode-toolkit-src
        uses: actions/download-artifact@v4
        with:
          name: scancode-toolkit-src
      - name: Extract scancode-toolkit source
        run: tar -xzf scancode-toolkit-src.tar.gz
      - name: Run build_wheels.sh
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi8).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi8).tested_on }}"
          chmod +x ./gha-script/build_wheels.sh; bash ./gha-script/build_wheels.sh
          WHEEL_FILE=$(ls *.whl 2>/dev/null | head -n 1)
          LOG_NAME="${WHEEL_FILE:+${WHEEL_FILE%.whl}_py312_log}.gz"
          [ -z "$WHEEL_FILE" ] && LOG_NAME="wheel_build_log_ubi8_py312.gz"
          gzip wheel_build_log && mv wheel_build_log.gz "$LOG_NAME"
          echo "[INFO] Log upload skipped (no credentials configured)"
      - name: Run scancode scan on wheel
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          chmod +x ./gha-script/scanner-scripts/scancode_wheel_scan.sh
          bash ./gha-script/scanner-scripts/scancode_wheel_scan.sh
      - name: Run grype scan on wheel
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export GRYPE_BIN="$GITHUB_WORKSPACE/scan-tools-bin/grype"
          chmod +x ./gha-script/scanner-scripts/grype_wheel_scan.sh
          bash ./gha-script/scanner-scripts/grype_wheel_scan.sh
      - name: Upload wheel scan results
        run: |
          source package-cache/variable.sh
          mkdir -p wheel_scancode_py312; find . -maxdepth 1 -name "*_output.json" ! -name "*_grype_output.json" -exec cp {} wheel_scancode_py312/ \;
          tar czf wheel_scancode_py312.tar.gz wheel_scancode_py312
          mkdir -p grype_wheel_py312; find . -maxdepth 1 -name "*_grype_output.json" -exec cp {} grype_wheel_py312/ \;
          tar czf grype_wheel_py312.tar.gz grype_wheel_py312
          echo "[INFO] Scan result upload skipped (no credentials configured)"
      - name: Upload wheel to COS
        run: |
          if ls *.whl 1>/dev/null 2>&1; then
            echo "[INFO] Wheel upload skipped (no credentials configured): $(ls *.whl)"
          else
            echo "No wheel file found!"; exit 1
          fi
      - name: Upload CVE report
        run: echo "[INFO] CVE report upload skipped (no credentials configured)"

  # UBI9 wheel jobs (py310–py314) -----------------------------------------------

  wheel_build_ubi9_py310:
    needs: [build_info, install_scan_tools]
    if: >-
      ${{ inputs.wheel_build == 'true' &&
          needs.build_info.outputs.script_ubi9 != '' &&
          !contains(needs.build_info.outputs.skip_python_versions, '3.10') }}
    runs-on: ${{ inputs.large-runner-label != '' && inputs.large-runner-label || 'self-hosted' }}
    env:
      PYTHON_VERSION: "3.10"
      BUILD_SCRIPT: ${{ fromJson(needs.build_info.outputs.script_ubi9).script }}
      TESTED_ON:    ${{ fromJson(needs.build_info.outputs.script_ubi9).tested_on }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      VERSION:      ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt update -y
      - name: Download package-cache
        uses: actions/download-artifact@v4
        with:
          name: package-cache
      - name: Extract package cache
        run: tar -xzf package-cache.tar.gz
      - name: Download scan-tools-cache
        uses: actions/download-artifact@v4
        with:
