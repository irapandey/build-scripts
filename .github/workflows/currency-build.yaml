          key: scancode-pip-ppc64le-v32.4.0
      - name: Download scancode-toolkit-src
        uses: actions/download-artifact@v4
        with:
          name: scancode-toolkit-src
      - name: Extract scancode-toolkit source
        run: tar -xzf scancode-toolkit-src.tar.gz
      - name: Run build_wheels.sh
        run: |
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          export BUILD_SCRIPT="${{ fromJson(needs.build_info.outputs.script_ubi9).script }}"
          export TESTED_ON="${{ fromJson(needs.build_info.outputs.script_ubi9).tested_on }}"
          chmod +x ./gha-script/build_wheels.sh; bash ./gha-script/build_wheels.sh
          WHEEL_FILE=$(ls *.whl 2>/dev/null | head -n 1)
          LOG_NAME="${WHEEL_FILE:+${WHEEL_FILE%.whl}_py310_log}.gz"
          [ -z "$WHEEL_FILE" ] && LOG_NAME="wheel_build_log_ubi9_py310.gz"
          gzip wheel_build_log && mv wheel_build_log.gz "$LOG_NAME"
          echo "[INFO] Log upload skipped (no credentials configured)"
