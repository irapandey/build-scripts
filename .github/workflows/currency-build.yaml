          mkdir source_grype
          mv package-cache/grype_source_sbom_results.json \
             package-cache/grype_source_vulnerabilities_results.json source_grype
      - name: Upload Scanner Results
        run: |
          mkdir source
          source package-cache/variable.sh; source package-cache/scanner-env.sh
          find source_trivy -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_syft  -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
          find source_grype -mindepth 1 -exec mv -t source {} + 2>/dev/null || true
