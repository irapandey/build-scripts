          bash ./gha-script/scanner-scripts/grype_wheel_scan.sh
      - name: Upload wheel scan results
        run: |
          source package-cache/variable.sh
          mkdir -p wheel_scancode_py314; find . -maxdepth 1 -name "*_output.json" ! -name "*_grype_output.json" -exec cp {} wheel_scancode_py314/ \;
          tar czf wheel_scancode_py314.tar.gz wheel_scancode_py314
          mkdir -p grype_wheel_py314; find . -maxdepth 1 -name "*_grype_output.json" -exec cp {} grype_wheel_py314/ \;
          tar czf grype_wheel_py314.tar.gz grype_wheel_py314
          echo "[INFO] Scan result upload skipped (no credentials configured)"
      - name: Upload wheel to COS
        run: |
          if ls *.whl 1>/dev/null 2>&1; then
            echo "[INFO] Wheel upload skipped (no credentials configured): $(ls *.whl)"
